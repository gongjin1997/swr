<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · SWR 镜像构建平台</title><link rel="stylesheet" href="/static/style.css?v=1.2.0-dev.2"></head><body class="login-page">
<main class="login-shell"><div class="login-intro"><span class="eyebrow">SWR IMAGE BUILDER</span><h1 id="siteName">SWR 镜像构建平台</h1><p>从制品到镜像，<br>让每次发布有迹可循。</p><div class="login-steps"><span>01 上传制品</span><span>02 增量构建</span><span>03 推送与部署</span></div><p class="hint">面向私有云环境的镜像构建工作台</p></div>
<section class="card login-card"><div class="card-body"><h2>登录工作台</h2><p class="hint">使用管理员分配的账号登录</p><form id="loginForm" class="form"><div class="field"><label for="username">用户名</label><input type="text" id="username" name="username" autocomplete="username" required maxlength="32" autofocus></div><div class="field"><label for="password">密码</label><input type="password" id="password" name="password" autocomplete="current-password" required maxlength="128"></div><label class="check"><input type="checkbox" id="remember" checked> 记住我（仅建议在个人设备上使用）</label><div id="loginError" class="error-note hidden" role="alert"></div><button class="btn primary" type="submit" id="loginSubmit">登录</button></form><p class="hint login-help">首次启动：用户名为 admin，初始密码由管理员配置，或在服务器 data/admin-initial-password.txt 中读取。</p></div></section></main><script src="/static/login.js?v=1.2.0-dev.2"></script></body></html>
